# Copie para config.toml e ajuste. config.toml não vai para o git.

[mqtt]
# Valores que já aparecem preenchidos na tela (o broker Mosquitto da Alumbra).
broker = "192.168.100.162"
porta = 1883
topico = "NOVUS/Teste_Alumbra/#"
qos = 2
usuario = ""
senha = ""

[sqlserver]
# Deixe servidor vazio para rodar sem banco: os registros vão para contingencia/ e aparecem no log.
servidor = "TERRA\\SOLO"   # instância nomeada: precisa do serviço SQL Server Browser (UDP 1434)
banco = "MQTT"
tabela = "dbo.IOT001"
driver = "ODBC Driver 18 for SQL Server"
autenticacao_windows = false
usuario = "mqtt"
senha = ""                 # prefira digitar na tela e marcar "Lembrar senha" (fica no Windows, não aqui)
criptografar = "Optional"  # Optional | Mandatory | Strict
trust_server_certificate = false
timeout_conexao = 5

[gravacao]
lote_max = 500           # teto de registros por INSERT (as leituras que chegam juntas viram um lote)
lote_segundos = 1.0      # só com amostragem: espera máxima para juntar registros (com 0 abaixo, grava na hora)
pasta_contingencia = "contingencia"
pasta_logs = "logs"      # erros detalhados do dia em erros_AAAAMMDD.jsonl (a janela de erros lê daqui)
# 0 (padrão) = gravação imediata: cada leitura completa vai ao SQL Server assim que chega; as que chegam juntas
# (ex.: reenvio da memória do dispositivo depois de uma queda) viram um único lote de até lote_max.
# Amostragem (só se configurada, ex. 60): 1 linha por device_id por minuto de ts_unix (a leitura mais recente
# daquele minuto); a cada ciclo alinhado ao relógio (60 = hh:mm:00) grava todos os minutos já encerrados,
# inclusive os reenviados pela memória do dispositivo; o minuto corrente espera o próximo ciclo.
# Nos dois casos, a mesma leitura (device_id, ts_unix) não é gravada duas vezes (memória das últimas 24 h).
intervalo_gravacao_segundos = 0

[mapeamento]
# Como achar cada coluna da dbo.IOT001 no payload (JSON ou tabular com cabeçalho). A primeira chave encontrada
# vence; maiúsculas não importam; "a.b" é caminho aninhado no JSON ({"a": {"b": ...}}).
# pid, device_id e ts_unix são obrigatórios: sem eles a leitura vai para contingencia/ com o motivo no log.
pid = ["pid", "pid_id", "product_id", "id_produto"]  # no DigiRail é o código do modelo (constante), não nº de pacote
device_id = ["device_id", "deviceid", "device", "dispositivo", "id_dispositivo", "serial", "serial_number", "sn"]
ts_unix = ["ts_unix", "ts", "timestamp", "time", "epoch", "unix", "datahora", "data_hora", "datetime"]  # s, ms, µs, ns ou ISO 8601
chd1 = ["chd1_value", "chd1.value", "chd1"]
chd2 = ["chd2_value", "chd2.value", "chd2"]
chd3 = ["chd3_value", "chd3.value", "chd3"]
# chd4..chd6 vão para chd4_value..chd6_value depois de rodar sql/canais_4_a_6_iot001.sql (antes, só no payload_json)
chd4 = ["chd4_value", "chd4.value", "chd4"]
chd5 = ["chd5_value", "chd5.value", "chd5"]
chd6 = ["chd6_value", "chd6.value", "chd6"]
leituras = ["leituras", "readings", "dados", "data", "registros"]  # lista de leituras dentro de um objeto
device_do_topico = true      # sem device_id no payload: {id} de NOVUS/{id}/..., ou o nível do curinga da assinatura
fuso_sem_offset = "local"    # data/hora ISO sem fuso: "local" (do PC) ou "utc"
colunas_sem_cabecalho = []   # tabular sem cabeçalho: ex. ["pid", "device_id", "ts", "chd1", "chd2", "chd3"]

[vigia]
# Com o app conectado, se passar este tempo sem nenhuma gravação com sucesso no SQL Server (ou sem nenhuma leitura
# recebida, quando o SQL não está configurado), o programa se reinicia sozinho e reconecta. 0 desliga.
# A aba Atividade mostra a contagem regressiva ("Reinício automático em 59:12 se nada for gravado").
minutos = 60

[inicio]
# Ao abrir o programa, testa o SQL Server e conecta no broker sozinho, com os últimos valores usados na tela.
# false = espera o clique em Conectar. (O reinício automático do vigia conecta de qualquer jeito.)
# Para gravar no banco sem digitar nada, a senha precisa estar salva ("Lembrar senha").
conectar_automaticamente = true

[mosquitto]
# Aba Mosquitto: ao abrir o programa, roda o broker local como processo filho e mostra a saída ao vivo
# (prompt "<pasta>><comando>"). Ele para ao fechar o programa e volta junto no reinício automático.
# Se o Mosquitto já roda como serviço do Windows, pare o serviço ou use iniciar_automaticamente = false
# (os dois não podem ouvir a porta 1883 ao mesmo tempo).
pasta = "C:\\Program Files\\mosquitto168"   # padrão; o campo "Endereço Mosquitto" da aba vale mais (fica salvo no programa)
comando = "mosquitto -v"     # 1º token = programa (.exe é acrescentado se faltar); o resto são argumentos
iniciar_automaticamente = true

[dispositivos]
# Comandos aos NOVUS DigiRail IoT ({id} = device_id). O integrador publica com QoS 1 e espera a resposta.
# Se a assinatura da tela não cobrir o tópico de resposta, ele assina também (ex.: NOVUS/+/ack/command).
# Padrões dos 5 tópicos de cada dispositivo. Para um aparelho com tópico diferente (ex.: o NXperience gravou
# "NOÏUS/Teste_Alumbra/ack/command"), troque na aba Clientes > Tópicos…; fica salvo em arquivo_topicos.
topico_dados = "NOVUS/{id}/events"
topico_config = "NOVUS/{id}/config"
topico_ack_config = "NOVUS/{id}/ack/config"
topico_comando = "NOVUS/{id}/command"
topico_resposta = "NOVUS/{id}/ack/command"   # confirmação de comando
arquivo_topicos = "dispositivos.json"        # na pasta do programa
diagnostico_minutos = 3           # pede diagnóstico ao ver o dispositivo (a cada conexão) e a cada N min; 0 desliga
timeout_comando_segundos = 15     # sem resposta nesse tempo: "sem resposta do dispositivo"

[oee]
# Cadastro dos dispositivos no portal OEE (mesmo SQL Server e mesmo login de [sqlserver], nome em 3 partes).
# Cada diagnóstico recebido cria/atualiza a linha do device (codigo = device_id); as leituras renovam
# ultimo_sinal_em (no máx. 1 vez por minuto). Nunca mexe em maquina_id, nome, tipo, ativo nem unidade de quem já
# existe. Sem o banco, a tabela ou a permissão, a etapa se desliga sozinha (1 INFO no log). Permissões:
# sql/permissoes_oee.sql (rodar como admin). O integrador não cria nem altera a tabela do OEE.
habilitado = true
banco = "OEE"                    # nome do banco do portal (no .env do OEE pode ser outro, ex.: "OEE_Alumbra")
tabela = "dbo.dispositivos_iot"
unidade = "manutencao"           # manutencao | tecnologia | ambos (só na inserção)
tipo = "contador"                # só na inserção

[apontamentos]
# Apontamentos reais pelo IoT no portal OEE (docs/apontamentos_reais.md). A cada ciclo o integrador lê as máquinas
# ativas com dispositivo IoT de produção (banco de [oee]), as leituras da IOT001 e grava a timeline em
# apontamentos_estado: contador subiu = produção; intervalo < micro = 2 Produção Normal, entre micro e macro = 99
# Microparada, >= macro = 98 Macro parada. O IoT prevalece sobre apontamentos manuais (aparados/excluídos, com aviso).
# Precisa do SQL Server configurado com senha (ou autenticação do Windows); roda mesmo sem o MQTT conectado.
# Permissões: sql/permissoes_oee.sql. O integrador não cria legendas nem altera tabelas do OEE.
habilitado = true
minutos = 3                      # periodicidade (a aba "Apontamentos reais" pode mudar; o valor da tela vale mais)
legenda_produzindo = "2"         # códigos das legendas no portal (já cadastradas)
legenda_micro = "99"
legenda_macro = "98"
fuso = "America/Sao_Paulo"       # dia local: um apontamento não passa da meia-noite
