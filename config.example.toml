# Copie para config.toml e ajuste. config.toml não vai para o git.

[mqtt]
# Valores que já aparecem preenchidos na tela (o broker Mosquitto da Alumbra).
broker = "192.168.100.162"
porta = 1883
topico = "NOVUS/Teste_Alumbra/#"
qos = 2
usuario = ""
senha = ""

[sqlserver]
# Deixe servidor vazio para rodar sem banco: os registros vão para contingencia/ e aparecem no log.
servidor = "TERRA\\SOLO"   # instância nomeada: precisa do serviço SQL Server Browser (UDP 1434)
banco = "MQTT"
tabela = "dbo.IOT001"
driver = "ODBC Driver 18 for SQL Server"
autenticacao_windows = false
usuario = "mqtt"
senha = ""                 # prefira digitar na tela e marcar "Lembrar senha" (fica no Windows, não aqui)
criptografar = "Optional"  # Optional | Mandatory | Strict
trust_server_certificate = false
timeout_conexao = 5

[gravacao]
lote_max = 500           # grava quando juntar esta quantidade...
lote_segundos = 1.0      # ...ou quando passar este tempo, o que vier primeiro
pasta_contingencia = "contingencia"
pasta_logs = "logs"      # erros detalhados do dia em erros_AAAAMMDD.jsonl (a janela de erros lê daqui)
# Amostragem pelo minuto da leitura (ts_unix): 1 linha por device_id por minuto (a leitura mais recente daquele
# minuto). A cada ciclo alinhado ao relógio (60 = hh:mm:00) grava todos os minutos já encerrados, inclusive os
# antigos reenviados pela memória do dispositivo depois de uma queda; o minuto corrente espera o próximo ciclo.
# 0 = grava todas (por lote_max/lote_segundos, como acima). Nos dois casos, a mesma leitura (device_id, ts_unix)
# não é gravada duas vezes (memória das últimas 24 h).
intervalo_gravacao_segundos = 60

[mapeamento]
# Como achar cada coluna da dbo.IOT001 no payload (JSON ou tabular com cabeçalho). A primeira chave encontrada
# vence; maiúsculas não importam; "a.b" é caminho aninhado no JSON ({"a": {"b": ...}}).
# pid, device_id e ts_unix são obrigatórios: sem eles a leitura vai para contingencia/ com o motivo no log.
pid = ["pid", "pid_id", "product_id", "id_produto"]  # no DigiRail é o código do modelo (constante), não nº de pacote
device_id = ["device_id", "deviceid", "device", "dispositivo", "id_dispositivo", "serial", "serial_number", "sn"]
ts_unix = ["ts_unix", "ts", "timestamp", "time", "epoch", "unix", "datahora", "data_hora", "datetime"]  # s, ms, µs, ns ou ISO 8601
chd1 = ["chd1_value", "chd1.value", "chd1"]
chd2 = ["chd2_value", "chd2.value", "chd2"]
chd3 = ["chd3_value", "chd3.value", "chd3"]
leituras = ["leituras", "readings", "dados", "data", "registros"]  # lista de leituras dentro de um objeto
device_do_topico = true      # sem device_id no payload: {id} de NOVUS/{id}/..., ou o nível do curinga da assinatura
fuso_sem_offset = "local"    # data/hora ISO sem fuso: "local" (do PC) ou "utc"
colunas_sem_cabecalho = []   # tabular sem cabeçalho: ex. ["pid", "device_id", "ts", "chd1", "chd2", "chd3"]

[vigia]
# Com o app conectado, se passar este tempo sem nenhuma leitura recebida (ou sem gravação com sucesso no
# SQL Server, quando ele está configurado), o programa se reinicia sozinho e reconecta. 0 desliga.
minutos = 10

[inicio]
# Ao abrir o programa, testa o SQL Server e conecta no broker sozinho, com os últimos valores usados na tela.
# false = espera o clique em Conectar. (O reinício automático do vigia conecta de qualquer jeito.)
# Para gravar no banco sem digitar nada, a senha precisa estar salva ("Lembrar senha").
conectar_automaticamente = true

[mosquitto]
# Aba Mosquitto: ao abrir o programa, roda o broker local como processo filho e mostra a saída ao vivo
# (prompt "<pasta>><comando>"). Ele para ao fechar o programa e volta junto no reinício automático.
# Se o Mosquitto já roda como serviço do Windows, pare o serviço ou use iniciar_automaticamente = false
# (os dois não podem ouvir a porta 1883 ao mesmo tempo).
pasta = "C:\\Program Files\\mosquitto168"
comando = "mosquitto -v"     # 1º token = programa (.exe é acrescentado se faltar); o resto são argumentos
iniciar_automaticamente = true

[dispositivos]
# Comandos aos NOVUS DigiRail IoT ({id} = device_id). O integrador publica com QoS 1 e espera a resposta.
# Se a assinatura da tela não cobrir o tópico de resposta, ele assina também (ex.: NOVUS/+/ack/command).
topico_comando = "NOVUS/{id}/command"
topico_resposta = "NOVUS/{id}/ack/command"
diagnostico_minutos = 30          # pede diagnóstico ao ver o dispositivo (a cada conexão) e a cada N min; 0 desliga
timeout_comando_segundos = 15     # sem resposta nesse tempo: "sem resposta do dispositivo"
