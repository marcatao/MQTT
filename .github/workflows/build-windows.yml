name: Gerar .exe para Windows

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:  # mudanças só de documentação/agentes não geram versão nova
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: write  # publicar o .zip na página Releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Gerar o executável
        shell: cmd
        run: build_exe.bat

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: MQTT-SQLServer-windows
          path: dist/MQTT-SQLServer/
          retention-days: 30

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/MQTT-SQLServer/* -DestinationPath MQTT-SQLServer-windows.zip

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Integrador Alumbra MQTT + SQL + Mosquitto v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Versão de teste gerada a partir de `${{ github.ref_name }}` (${{ github.sha }}).
            Baixe **MQTT-SQLServer-windows.zip**, descompacte e abra `MQTT-SQLServer.exe`.
            Requer o ODBC Driver 18 (ou 17) for SQL Server no computador.
          files: MQTT-SQLServer-windows.zip
